name: PR title
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # Read event data only: never check out or execute the PR's code here.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9][a-zA-Z0-9._\/-]*\))?!?: \S[^\r\n]*$/;
            if (!pattern.test(title) || title.trim() !== title) {
              core.setFailed('Use type(optional-scope)!: description; e.g. feat(models): support another pipeline. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.');
            }
