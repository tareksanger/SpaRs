name: documentation-site
# Build the documentation site from docs/ and publish it to GitHub Pages. Pull requests that
# change the site build and check it, so a broken page or link shows as a failed check; only a
# push to main, or a manual run on main, publishes. The path filter means this check cannot be a
# required one. After a failed deployment, start a manual run on main: a later push publishes
# only when it changes the paths below. Guide examples are executed by the acceptance run in
# ci.yml, not here.
on:
  push:
    branches: [main]
    paths: &site-paths
      - docs/**
      - tools/site/**
      - tools/package.json
      - tools/package-lock.json
      - .github/workflows/docs.yml
  pull_request:
    paths: *site-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request replaces its running build. On main a deployment in progress
  # finishes, and the newest waiting run follows it.
  group: documentation-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - name: Build the site
        run: tools/node_modules/.bin/vitepress build tools/site
      - name: Check links, tab titles and the files language models read
        run: node tools/site/check-site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
