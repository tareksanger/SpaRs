name: documentation-site
# Build the documentation site from docs/ and publish it to GitHub Pages. The site holds one copy
# per release, built from the release's tag, with the latest release at the root and main under
# "next"; tools/site/build-versions.mjs builds and checks them all. Pull requests that change the
# site build and check it, so a broken page or link shows as a failed check; only a push to main
# or a manual run on main publishes. The release workflow starts a manual run on main after it
# creates a release, because the tag it pushes starts no workflows. The path filter means this
# check cannot be a required one. After a failed deployment, start a manual run on main: a later
# push publishes only when it changes the paths below. Guide examples are executed by the
# acceptance run in ci.yml, not here.
on:
  push:
    branches: [main]
    paths: &site-paths
      - docs/**
      - tools/site/**
      - tools/package.json
      - tools/package-lock.json
      - .github/workflows/docs.yml
  pull_request:
    paths: *site-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to a pull request replaces its running build. Runs that publish share one group,
  # so a deployment in progress finishes and the newest waiting run follows it.
  group: documentation-site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The builder reads every release tag and unpacks the ones it builds.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - name: Build and check a copy of the site for each release and for this checkout
        run: node tools/site/build-versions.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
