name: native-fidelity
on: [push, pull_request]
jobs:
  reference-and-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12.5 .venv
      - run: uv pip sync --python .venv/bin/python tools/reference-requirements.lock
      - run: .venv/bin/python tools/acquire.py
      - run: .venv/bin/python tools/export.py
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path consumer/Cargo.toml
      - name: Run the same acceptance checks as local development
        run: .venv/bin/python tools/verify.py --report reports/verification-ci.json
      - name: Record performance separately from fidelity
        run: .venv/bin/python tools/benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-reports-${{ matrix.os }}
          path: reports/
