name: native-fidelity
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-and-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12.5 .venv
      - run: uv pip sync --python .venv/bin/python tools/reference-requirements.lock
      - run: .venv/bin/python tools/acquire.py
      - run: .venv/bin/python tools/export.py
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path consumer/Cargo.toml
      - run: cargo fetch --locked --manifest-path installer/Cargo.toml
      - run: cargo fetch --locked --manifest-path bindings/node/Cargo.toml
      - name: Run the same acceptance checks as local development
        run: .venv/bin/python tools/verify.py --report target/reports/verification-ci.json
      - name: Record performance separately from fidelity
        run: .venv/bin/python tools/benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-reports-${{ matrix.os }}
          path: target/reports/
          retention-days: 14

  native-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - run: cargo fetch --locked --manifest-path bindings/node/Cargo.toml
      - run: npm --prefix bindings/node run build
      - run: cargo build --locked --release --manifest-path installer/Cargo.toml
      - run: cargo build --locked --release --manifest-path consumer/Cargo.toml
      - name: Download and install without interpreters
        run: |
          model_path=$(env -i PATH= installer/target/release/spars-model install --version 3.8.0 --root target/models)
          env -i PATH= installer/target/release/spars-model verify "$model_path"
          env -i PATH= consumer/target/release/native-consumer-check "$model_path"
          node_bin=$(command -v node)
          env -i PATH= "$node_bin" bindings/node/scripts/smoke.mts "$model_path"
