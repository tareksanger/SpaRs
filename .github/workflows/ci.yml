name: native-fidelity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-and-rust:
    name: reference-and-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            model-reference-args: --model-exports-only
          - os: macos-latest
            model-reference-args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv venv --python 3.12.5 .venv
      - run: uv pip sync --python .venv/bin/python tools/reference-requirements.lock
      - run: .venv/bin/python tools/acquire.py --all
      - run: .venv/bin/python tools/export.py --all
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path consumer/Cargo.toml
      - name: Require the recorded model-reference architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Run the same acceptance checks as local development
        run: .venv/bin/python tools/verify.py ${{ matrix.model-reference-args }} --report target/reports/verification-ci.json
      - name: Record performance separately from fidelity
        run: .venv/bin/python tools/benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fidelity-reports-${{ matrix.os }}
          path: target/reports/
          retention-days: 14

  native-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --prefix bindings/node ci --ignore-scripts --no-audit --no-fund
      - run: cargo fetch --locked
      - run: npm --prefix bindings/node run build
      - run: cargo build --locked --release --manifest-path crates/spars-model/Cargo.toml
      - run: cargo build --locked --release --manifest-path consumer/Cargo.toml
      - name: Download and install without interpreters
        run: |
          node_bin=$(command -v node)
          for model in en_core_web_sm en_core_web_md en_core_web_lg; do
            model_path=$(env -i PATH= target/release/spars-model install --model "$model" --version 3.8.0 --root target/models)
            env -i PATH= target/release/spars-model verify "$model_path"
            env -i PATH= consumer/target/release/native-consumer-check "$model_path"
            env -i PATH= "$node_bin" bindings/node/scripts/smoke.mts "$model_path"
          done

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: node --test .github/scripts/*.test.cjs
