[package]
name = "spars"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental native Rust inference for official spaCy models"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tareksanger/SpaRs"
homepage = "https://github.com/tareksanger/SpaRs"
keywords = ["nlp", "spacy", "tokenization", "parsing"]
categories = ["text-processing", "science"]
include = [
    "/src/**",
    "!/src/**/tests.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/licenses/spacy-MIT.txt",
    "/licenses/thinc-MIT.txt",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fancy-regex = "0.16"
sha2 = "0.10"
safetensors = "0.6"
matrixmultiply = { version = "=0.3.10", default-features = false, features = ["std"] }

[profile.release]
debug = 1
