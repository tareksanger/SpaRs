[package]
name = "spars-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Node-API bindings for the native SpaRs NLP library"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
spars = { path = "../.." }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
debug = 1
